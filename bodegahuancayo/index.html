<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodega de Huancayo</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="script.js" defer></script>
</head>
<body class="bg-light">
<main class="container py-4">
<h1>Pedido de avena</h1>
<p>Simulación educativa. Precio por paquete: S/ 8.50.</p>
<form id="pedido" class="card p-3">
<div class="row g-3">
<div class="col-md-6">
<label for="cliente" class="form-label">Cliente</label>
<input id="cliente" name="cliente" class="form-control"
required maxlength="60">
</div>
<div class="col-md-6">
<label for="cantidad" class="form-label">Paquetes (1–100)</label>
<input id="cantidad" name="cantidad" type="number"
class="form-control" min="1" max="100" step="1" required>
</div>
</div>
<fieldset class="my-3">
<legend class="fs-5">Modalidad</legend>
<input id="recojo" name="modalidad" type="radio"
value="recojo" checked>
<label for="recojo">Recojo gratuito</label>
<input id="reparto" name="modalidad" type="radio"
value="reparto">
<label for="reparto">Reparto: S/ 4.00</label>
</fieldset>
<div>
<button class="btn btn-primary" type="submit">Calcular</button>
<button class="btn btn-secondary" type="reset">Limpiar</button>
</div>
</form>
<p id="mensaje" role="status" class="mt-3"></p>
<pre id="resultado" class="mt-3 text-wrap" aria-live="polite"></pre>
</main>
</body>
</html>
