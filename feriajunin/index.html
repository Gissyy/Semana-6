<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feria de productores</title>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="script.js" defer></script>
</head>
<body data-pagina="registro">
<main class="container py-4">
<h1>Feria de productores de Junín</h1>
<p>Inscripción simulada. Usa datos ficticios.</p>
<form id="feria">
<label for="nombre" class="form-label">Nombre completo</label>
<input id="nombre" name="nombre" class="form-control mb-2"
required maxlength="80">
<label for="dni" class="form-label">DNI de prueba: 8 dígitos</label>
<input id="dni" name="dni" class="form-control mb-2"
inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required>
<label for="correo" class="form-label">Correo</label>
<input id="correo" name="correo" type="email"
class="form-control mb-2" required>
<label for="distrito" class="form-label">Distrito</label>
<select id="distrito" name="distrito" class="form-select mb-2" required>
<option value="">Selecciona</option>
<option>Huancayo</option><option>El Tambo</option>
<option>Chilca</option>
</select>
<fieldset class="my-3">
<legend class="fs-5">Productos: elige al menos uno</legend>
<input id="papa" type="checkbox" name="productos" value="Papa">
<label for="papa">Papa</label>
<input id="miel" type="checkbox" name="productos" value="Miel">
<label for="miel">Miel</label>
<input id="queso" type="checkbox" name="productos" value="Queso">
<label for="queso">Queso</label>
</fieldset>
<label for="observaciones" class="form-label">Observaciones (opcional)</label>
<textarea id="observaciones" name="observaciones"
class="form-control mb-3" maxlength="200" rows="2"></textarea>
<button type="submit" class="btn btn-primary">Revisar</button>
</form>
<p id="mensaje" role="status"></p>
</main>
</body>
</html>
